# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
default_language_version:
  python: python3.12

repos:
  # ── Ruff: format + lint (official hooks, fast, no venv needed) ──
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      - id: ruff-format
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  # ── Pytest: run via uv so it picks up project deps ──
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run --directory backend pytest -x -q --tb=short
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
