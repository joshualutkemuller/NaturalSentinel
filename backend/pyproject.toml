[project]
name = "app"
version = "0.1.0"
description = "NaturalSentinel — Agentic regulatory change monitor"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]<1.0.0,>=0.114.2",
    "python-multipart<1.0.0,>=0.0.7",
    "email-validator<3.0.0.0,>=2.1.0.post1",
    "tenacity<9.0.0,>=8.2.3",
    "pydantic>2.0",
    "emails<1.0,>=0.6",
    "jinja2<4.0.0,>=3.1.4",
    "alembic<2.0.0,>=1.12.1",
    "httpx<1.0.0,>=0.25.1",
    "psycopg[binary]<4.0.0,>=3.1.13",
    "sqlmodel<1.0.0,>=0.0.21",
    "pydantic-settings<3.0.0,>=2.2.1",
    "sentry-sdk[fastapi]>=2.0.0,<3.0.0",
    "pyjwt<3.0.0,>=2.8.0",
    "pwdlib[argon2,bcrypt]>=0.3.0",
    # NaturalSentinel additions
    "anthropic>=0.40",
    "openai>=1.50",
    "google-genai>=1.0",
    "mcp>=1.0",
    "scikit-learn>=1.4",
    "openviking>=0.2",
    "qdrant-client>=1.9",
    "feedparser>=6.0",
]

[dependency-groups]
dev = [
    "pytest<8.0.0,>=7.4.3",
    "mypy<2.0.0,>=1.8.0",
    "ruff<1.0.0,>=0.2.2",
    "pre-commit>=4.0.0,<5.0.0",
    "prek>=0.2.24,<1.0.0",
    "coverage<8.0.0,>=7.4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests that hit real APIs (deselect with '-m \"not slow\"')",
]

[tool.mypy]
strict = false
exclude = ["venv", ".venv", "alembic"]
warn_return_any = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency-injected args (current_user, sessions, clients) live in route
# signatures even when the body doesn't read them — the injection still runs auth
# and resource lifecycle. Don't lint them as unused.
"app/api/routes/*" = ["ARG001"]
# Fetcher modules implement a uniform fetch(...) protocol; per-source impls may
# legitimately ignore some protocol args (e.g. state_codes for federal-only fetchers).
"app/naturalsentinel/fetchers/live/*" = ["ARG001"]
# Document intelligence layer uses callback / protocol-shaped functions where some
# args (full_text, file_name, qdrant_client, defn, doc_types, description) are
# part of the protocol contract even when individual implementations don't read them.
"app/naturalsentinel/documents/extractors.py" = ["ARG001"]
"app/naturalsentinel/documents/pipeline.py" = ["ARG001"]
"app/naturalsentinel/documents/process_engine.py" = ["ARG001"]
"app/naturalsentinel/documents/retrieval.py" = ["ARG001"]
# CLI startup error fallback prints to stderr when the MCP SDK is unavailable —
# logger isn't initialized yet at that point.
"app/naturalsentinel/mcp/document_server.py" = ["T201"]
# Test fixture args from pytest are often unused inside the test body but must
# stay in the signature for fixture wiring.
"tests/**/*.py" = ["ARG001", "F841"]

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true
