[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "naturalsentinel"
version = "0.1.0"
description = "NaturalSentinel — Agentic regulatory change monitor with persistent memory and MCP server"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "NaturalSentinel Contributors"}]

dependencies = [
    "pydantic>=2.12.5",
]  # Zero deps for core — all LLM providers are optional

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai    = ["openai>=1.50"]
gemini    = ["google-genai>=1.0"]
mcp       = ["mcp>=1.0", "uvicorn>=0.30", "starlette>=0.40"]
search    = ["scikit-learn>=1.4"]
ui        = ["streamlit>=1.40"]
dev       = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=4.0",
]
all = ["naturalsentinel[anthropic,openai,gemini,mcp,search,ui,dev]"]

[project.scripts]
naturalsentinel     = "naturalsentinel.cli:main"
naturalsentinel-mcp = "naturalsentinel.mcp.server:main"
naturalsentinel-chat = "naturalsentinel.langchain_chat:main"

[tool.hatch.build.targets.wheel]
packages = ["src/naturalsentinel"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=4.5.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests that hit real APIs (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # Line length handled by ruff format; string literals are left as-is

[tool.coverage.run]
source = ["naturalsentinel"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["naturalsentinel"]
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
