[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "naturalsentinel"
version = "0.1.0"
description = "NaturalSentinel — Agentic regulatory change monitor with persistent memory and MCP server"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "NaturalSentinel Contributors"}]

dependencies = []  # Zero deps for core — all LLM providers are optional

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai    = ["openai>=1.50"]
gemini    = ["google-genai>=1.0"]
mcp       = ["mcp>=1.0", "uvicorn>=0.30", "starlette>=0.40"]
search    = ["scikit-learn>=1.4"]
dev       = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]
all = ["naturalsentinel[anthropic,openai,gemini,mcp,search,dev]"]

[project.scripts]
naturalsentinel     = "naturalsentinel.cli:main"
naturalsentinel-mcp = "naturalsentinel.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests that hit real APIs (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.coverage.run]
source = ["naturalsentinel"]
